[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lora-ft"
version = "1.0.0"
description = "LoRA / QLoRA fine-tuning of a small open LLM for intent classification (Banking77), with a measured comparison against zero-shot and few-shot prompting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4",
    "transformers>=5.0",
    "peft>=0.15",
    "accelerate>=1.0",
    "datasets>=3.0",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
qlora = ["bitsandbytes>=0.45"]
hub = ["huggingface_hub>=0.30"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
lora-ft = "lora_ft.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lora_ft"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
